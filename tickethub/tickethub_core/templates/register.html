{% extends "base.html" %}

{% block title %}Register — TicketHub{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrapper">
        <div class="card card-glass auth-card fade-in-up">
            <h2 class="auth-title">Create Account</h2>
            <p class="auth-subtitle">Join TicketHub and start booking events</p>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required autofocus>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Create a strong password" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg mt-2">Create Account</button>
            </form>

            <p class="text-center mt-3" style="color: var(--text-secondary); font-size: 0.9rem;">
                Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
